name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
            task: publish:linux
            out_dir: publish/linux-x64/app
            archive: Jabsco-${{ github.event.release.tag_name }}-linux-x64.tar.gz
            kind: tar.gz

          - name: macos-arm64
            runner: macos-latest
            task: publish:mac
            out_dir: publish/macos-arm64/app
            archive: Jabsco-${{ github.event.release.tag_name }}-macos-arm64.tar.gz
            kind: tar.gz

          - name: windows-x64
            runner: windows-latest
            task: publish:win
            out_dir: publish/windows-x64/ui
            archive: Jabsco-${{ github.event.release.tag_name }}-windows-x64.zip
            kind: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install toolchain
        run: mise install

      - name: Build release folder
        run: mise run ${{ matrix.task }}

      - name: Verify output exists
        shell: bash
        run: |
          test -d "${{ matrix.out_dir }}"
          find "${{ matrix.out_dir }}" -maxdepth 2 -type f | head

      - name: Create tar.gz archive
        if: matrix.kind == 'tar.gz'
        shell: bash
        run: |
          parent="$(dirname "${{ matrix.out_dir }}")"
          base="$(basename "${{ matrix.out_dir }}")"
          tar -C "$parent" -czf "${{ matrix.archive }}" "$base"

      - name: Create zip archive
        if: matrix.kind == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.out_dir }}\*" -DestinationPath "${{ matrix.archive }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.archive }}
