[tools]
dotnet = "10"

[tasks.build]
description = "Build all projects (debug)"
run = "dotnet build"

[tasks.start]
description = "Run Jabsco NOW"
run = "dotnet run --project src/Jabsco.Ui"

[tasks.test]
description = "Run unit tests"
run = "dotnet test"

[tasks.clean]
description = "Remove build artifacts and publish output"
run = "dotnet clean && rm -rf publish/"

[tasks.outdated]
description = "List outdated NuGet packages across the solution"
run = "dotnet list package --outdated"

[tasks.update]
description = "Update NuGet packages to latest minor versions only (no major bumps)"
run = """
#!/usr/bin/env bash
set -euo pipefail
if ! command -v dotnet-outdated >/dev/null 2>&1; then
  dotnet tool install --global dotnet-outdated-tool
fi
dotnet outdated --upgrade --version-lock Major
"""

[tasks.upgrade]
description = "Upgrade all outdated NuGet packages to the latest version"
run = """
#!/usr/bin/env bash
set -euo pipefail
 
# Requires the dotnet-outdated global tool:
#   dotnet tool install --global dotnet-outdated-tool
if ! command -v dotnet-outdated >/dev/null 2>&1; then
  echo "dotnet-outdated not found. Installing..."
  dotnet tool install --global dotnet-outdated-tool
fi
 
dotnet outdated --upgrade
"""

# ── Windows native DLL ─────────────────────────────────────────────────────────

[tasks."native:win"]
description = "Cross-compile freerdp3.dll for Windows x64 → native/win-x64/"
run = "scripts/build-win-native.sh"

# ── Windows x64 ────────────────────────────────────────────────────────────────

[tasks."publish:win"]
description = "Publish all apps for Windows x64 → publish/windows-x64/"
run = """
#!/usr/bin/env bash
set -e
RID=win-x64
OUT=publish/windows-x64

# Build freerdp3.dll if not already present
scripts/build-win-native.sh

echo "→ Jabsco.Ui ($RID)"
dotnet publish src/Jabsco.Ui -c Release -r $RID --self-contained \
    -o $OUT/app

# Copy native FreeRDP DLLs into Jabsco.exe output
if ls native/win-x64/*.dll &>/dev/null; then
    echo "→ Copying native DLLs"
    for dir in $OUT/app; do
        [[ -d "$dir" ]] && cp native/win-x64/*.dll "$dir/"
    done
fi

echo "✓ Windows build → $OUT/"
"""

# ── Linux x64 ──────────────────────────────────────────────────────────────────

[tasks."publish:linux"]
description = "Publish all apps for Linux x64 → publish/linux-x64/"
run = """
#!/usr/bin/env bash
set -e
RID=linux-x64
OUT=publish/$RID

echo "→ Jabsco.Ui ($RID)"
dotnet publish src/Jabsco.Ui -c Release -r $RID --self-contained \
    -p:PublishSingleFile=true \
    -p:IncludeNativeLibrariesForSelfExtract=true \
    -p:TrimMode=link \
    -o $OUT/app

echo "✓ Linux build → $OUT/"
"""

# ── macOS universal ────────────────────────────────────────────────────────────

[tasks."publish:mac"]
description = "Publish all apps for macOS → publish/macos-arm64/ (pass --universal for arm64+x64 fat binaries)"
run = """
#!/usr/bin/env bash
set -e

# FreeRDP must be installed via Homebrew: brew install freerdp

UNIVERSAL=false
for arg in "$@"; do
    [[ "$arg" == "--universal" ]] && UNIVERSAL=true
done

publish_app() {
    local src=$1 name=$2 extra=${3:-}
    local RID=osx-arm64 OUT=publish/macos-arm64
    dotnet publish src/$src -c Release -r $RID --self-contained $extra \
        -o $OUT/$name -nologo -v q
}

publish_universal_app() {
    local src=$1 name=$2 extra=${3:-}
    echo "→ $name (arm64 + x64)"
    dotnet publish src/$src -c Release -r osx-arm64 --self-contained $extra \
        -o publish/macos-arm64/$name -nologo -v q
    dotnet publish src/$src -c Release -r osx-x64   --self-contained $extra \
        -o publish/macos-x64/$name   -nologo -v q

    local arm64=publish/macos-arm64/$name x64=publish/macos-x64/$name dest=publish/macos-universal/$name
    mkdir -p "$dest"
    cp -r "$arm64/." "$dest/"
    while IFS= read -r -d '' f; do
        rel="${f#$arm64/}"
        x64f="$x64/$rel"
        if [[ -f "$x64f" ]] && file "$f" 2>/dev/null | grep -q "Mach-O"; then
            lipo -create "$f" "$x64f" -output "$dest/$rel"
        fi
    done < <(find "$arm64" -type f -print0)
}

if $UNIVERSAL; then
    if ! command -v lipo &>/dev/null; then
        echo "error: lipo not found — --universal requires macOS" >&2
        exit 1
    fi
    publish_universal_app Jabsco.Ui         app         "-p:PublishSingleFile=true"
    rm -rf publish/macos-arm64 publish/macos-x64
    echo "✓ macOS universal build → publish/macos-universal/"
else
    echo "→ Jabsco.Ui (osx-arm64)"
    publish_app Jabsco.Ui         app         "-p:PublishSingleFile=true"
    echo "✓ macOS build → publish/macos-arm64/"
fi
"""

# ── All ────────────────────────────────────────────────────────────────────────

[tasks."publish:all"]
description = "Publish for Windows, Linux, and macOS"
depends = ["publish:win", "publish:linux", "publish:mac"]
